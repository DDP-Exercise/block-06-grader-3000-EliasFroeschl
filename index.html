<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grader 3000</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Grader 3000</h1>

    <section>
        <h2>Exercises</h2>
        <div id="exercise-inputs"></div>
    </section>

    <section>
        <h2>Exam</h2>
        <div id="exam-input"></div>
    </section>

    <section>
        <h2>Attendance</h2>
        <div id="attendance-input"></div>
    </section>

    <section>
        <h2>Result</h2>

        <p id="exercise-result">Exercise grade: 0%</p>
        <p id="exam-result">Exam: 0%</p>
        <p id="attendance-result">Attendance: 100%</p>
        <p id="total-result">Total: 0%</p>
        <p id="grade-result">Grade: Nicht Genügend</p>
        <p id="message-result">Message: Exam is negative.</p>
    </section>
</main>

<script type=module src="controller.js"></script>

</body>
</html>
